
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Fonsichu</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  background: #000;
}

.video-area {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #000;
}

.video-area iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}

/* Botón minimalista de pantalla completa */
.fullscreen-button {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 5;

  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #fff;
  background: rgba(20, 20, 20, 0.65);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 11px;

  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  opacity: 0.65;
  transition: all .2s ease;
}

.fullscreen-button:hover {
  opacity: 1;
  background: rgba(130, 75, 190, 0.85);
  border-color: rgba(255,255,255,0.35);
  transform: scale(1.06);
}

.fullscreen-button svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chat {
  min-width: 0;
  min-height: 0;
  background: #0e0e10;
  border-left: 1px solid #252525;
}

.chat iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Pantalla completa solo del vídeo */
.video-area:fullscreen {
  width: 100%;
  height: 100%;
  background: #000;
}

.video-area:fullscreen iframe {
  width: 100%;
  height: 100%;
}

/* Móvil */
@media (max-width: 700px) {
  html, body {
    overflow: auto;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  .video-area {
    width: 100%;
    aspect-ratio: 16 / 9;
    flex: none;
  }

  .chat {
    flex: 1;
    border-left: none;
    border-top: 1px solid #252525;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- VÍDEO -->
  <section class="video-area" id="videoArea">

    <iframe
      src="https://player.kick.com/fonsichu"
      title="Fonsichu"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>

    <button
      class="fullscreen-button"
      id="fullscreenButton"
      onclick="toggleFullscreen()"
      aria-label="Pantalla completa"
      title="Pantalla completa">

      <svg id="fullscreenIcon" viewBox="0 0 24 24">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>

    </button>

  </section>

  <!-- CHAT -->
  <section class="chat">
    <iframe
      src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io&darkpopout"
      title="Chat de Twitch"
      allow="clipboard-write; encrypted-media">
    </iframe>
  </section>

</div>

<script>
const videoArea = document.getElementById("videoArea");
const fullscreenIcon = document.getElementById("fullscreenIcon");

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await videoArea.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Error al activar pantalla completa:", error);
  }
}

document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    fullscreenIcon.innerHTML = `
      <path d="M8 3v5H3"/>
      <path d="M16 3v5h5"/>
      <path d="M3 16h5v5"/>
      <path d="M21 16h-5v5"/>
    `;
  } else {
    fullscreenIcon.innerHTML = `
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
    `;
  }
});
</script>

</body>
</html>
