<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fonsichu 🔴 Stream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px;
      background: #15151d;
      border-bottom: 2px solid #53fc18;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .live {
      color: #53fc18;
      font-size: 0.9rem;
      margin-top: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* STREAM DE KICK */
    .stream {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 30px;
      border-radius: 12px;
      overflow: hidden;
    }

    .stream iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* CHAT DE TWITCH */
    h2 {
      margin-bottom: 12px;
    }

    .chat {
      width: 100%;
      height: 500px;
      background: #18181b;
      border-radius: 12px;
      overflow: hidden;
    }

    .chat iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* MÓVIL */
    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .chat {
        height: 600px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>FONSICHU 🔴</h1>
    <div class="live">● STREAM EN DIRECTO</div>
  </header>

  <main class="container">

    <!-- STREAM DE KICK -->
    <div class="stream">
      <iframe
        src="https://player.kick.com/fonsichu"
        allowfullscreen>
      </iframe>
    </div>

    <!-- CHAT DE TWITCH -->
    <h2>💬 Chat de Twitch</h2>

    <div class="chat">
      <iframe
        src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io"
        scrolling="no">
      </iframe>
    </div>

  </main>

</body>
</html>
