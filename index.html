
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonsichu</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.container {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  width: 100%;
  height: 100vh;
}

.video {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  min-width: 0;
}

.video iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.chat {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #0e0e10;
  border-left: 1px solid #242424;
}

.chat iframe {
  width: 100%;
  height: 100%;
  border: none;
}

@media (max-width: 700px) {
  html, body {
    overflow: auto;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  .video {
    width: 100%;
    aspect-ratio: 16 / 9;
    flex: none;
  }

  .video iframe {
    width: 100%;
    height: 100%;
  }

  .chat {
    flex: 1;
    min-height: 0;
    border-left: none;
    border-top: 1px solid #242424;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="video">
    <iframe
      src="https://player.kick.com/fonsichu"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="chat">
    <iframe
      src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io&darkpopout">
    </iframe>
  </div>

</div>
</body>
</html>
