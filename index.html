
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Fonsichu</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

:root {
  --bar-height: 66px;
}

/* DISTRIBUCIÓN PRINCIPAL */

.container {
  width: 100%;
  height: calc(100dvh - var(--bar-height));
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  background: #000;
}

.video-area {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #000;
}

.video-area iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}

.chat {
  min-width: 0;
  min-height: 0;
  background: #0e0e10;
  border-left: 1px solid #252525;
}

.chat iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}

/* BOTÓN PANTALLA COMPLETA */

.fullscreen-button {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 5;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: rgba(20,20,20,.65);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 11px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: .65;
  transition: .2s;
}

.fullscreen-button:hover {
  opacity: 1;
  background: #8145c5;
  transform: scale(1.06);
}

.fullscreen-button svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* BARRA INFERIOR */

.taskbar {
  height: var(--bar-height);
  width: 100%;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 22px;
  background: #111113;
  border-top: 1px solid #303034;
  box-shadow: 0 -5px 25px rgba(0,0,0,.25);
}

/* LOGO Y NOMBRE */

.channel-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.channel-logo {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  object-fit: contain;
  border-radius: 9px;
}

.channel-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1.5px;
  white-space: nowrap;
}

/* ICONOS DE REDES */

.socials {
  display: flex;
  align-items: center;
  gap: 8px;
}

.social-link {
  width: 43px;
  height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  color: #d8d5dc;
  background: #242428;
  border: 1px solid transparent;
  text-decoration: none;
  transition: all .2s ease;
}

.social-link svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
}

.social-link:hover {
  color: white;
  transform: translateY(-3px);
  border-color: #ffffff35;
  box-shadow: 0 4px 14px #0006;
}

/* COLORES AL PASAR EL RATÓN */

.social-link.youtube:hover {
  background: #c4302b;
}

.social-link.twitch:hover {
  background: #6441a5;
}

.social-link.kick:hover {
  background: #238c4b;
}

.social-link.tiktok:hover {
  background: #000000;
}

.social-link.x:hover {
  background: #1686df;
}

/* ACCESIBILIDAD */

.social-link:focus-visible,
.fullscreen-button:focus-visible {
  outline: 2px solid #b875ff;
  outline-offset: 3px;
}

/* PANTALLA COMPLETA */

.video-area:fullscreen {
  width: 100%;
  height: 100%;
  background: #000;
}

.video-area:fullscreen iframe {
  width: 100%;
  height: 100%;
}

/* MÓVIL */

@media (max-width: 700px) {
  :root {
    --bar-height: 60px;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: calc(100dvh - var(--bar-height));
  }

  .video-area {
    width: 100%;
    aspect-ratio: 16 / 9;
    flex: none;
  }

  .chat {
    flex: 1;
    border-left: none;
    border-top: 1px solid #252525;
  }

  .taskbar {
    padding: 0 10px;
    gap: 8px;
  }

  .channel-logo {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
  }

  .channel-title {
    font-size: 12px;
    letter-spacing: 1px;
  }

  .socials {
    gap: 5px;
  }

  .social-link {
    width: 34px;
    height: 36px;
    border-radius: 8px;
  }

  .social-link svg {
    width: 18px;
    height: 18px;
  }
}

@media (max-width: 390px) {
  .taskbar {
    padding: 0 7px;
  }

  .channel-info {
    gap: 6px;
  }

  .channel-title {
    font-size: 10px;
  }

  .socials {
    gap: 3px;
  }

  .social-link {
    width: 30px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- REPRODUCTOR KICK -->
  <section class="video-area" id="videoArea">

    <iframe
      src="https://player.kick.com/fonsichu"
      title="Fonsichu"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>

    <button
      class="fullscreen-button"
      onclick="toggleFullscreen()"
      aria-label="Pantalla completa"
      title="Pantalla completa">

      <svg id="fullscreenIcon" viewBox="0 0 24 24">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>

    </button>
  </section>

  <!-- CHAT TWITCH -->
  <section class="chat">
    <iframe
      src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io&darkpopout"
      title="Chat de Twitch">
    </iframe>
  </section>

</div>

<!-- BARRA INFERIOR -->

<footer class="taskbar">

  <div class="channel-info">
    <img
      src="logo.png"
      alt="Logo Fonsichu"
      class="channel-logo">

    <div class="channel-title">FONSICHU</div>
  </div>

  <nav class="socials" aria-label="Redes sociales">

    <!-- YOUTUBE -->
    <a class="social-link youtube"
       href="https://www.youtube.com/@fonsichu"
       target="_blank" rel="noopener noreferrer"
       aria-label="YouTube" title="YouTube">
      <svg viewBox="0 0 24 24">
        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
      </svg>
    </a>

    <!-- TWITCH -->
    <a class="social-link twitch"
       href="https://www.twitch.tv/fonsichu"
       target="_blank" rel="noopener noreferrer"
       aria-label="Twitch" title="Twitch">
      <svg viewBox="0 0 24 24">
        <path d="M4 2 1 6v15h5v3h4l3-3h4l6-6V2H4Zm17 12-4 4h-5l-3 3v-3H4V4h17v10ZM17 7h-2v6h2V7Zm-5 0h-2v6h2V7Z"/>
      </svg>
    </a>

    <!-- KICK -->
    <a class="social-link kick"
       href="https://kick.com/fonsichu"
       target="_blank" rel="noopener noreferrer"
       aria-label="Kick" title="Kick">
      <svg viewBox="0 0 24 24">
        <path d="M3 2h7v7l5-7h7l-7 9 7 11h-8l-4-7v7H3V2Z"/>
      </svg>
    </a>

    <!-- TIKTOK -->
    <a class="social-link tiktok"
       href="https://www.tiktok.com/@fonsichu"
       target="_blank" rel="noopener noreferrer"
       aria-label="TikTok" title="TikTok">
      <svg viewBox="0 0 24 24">
        <path d="M19.6 6.2a5.8 5.8 0 0 1-3.5-4.8h-4.2v15.2a3.2 3.2 0 1 1-3.2-3.2c.4 0 .8.1 1.1.2V9.3a7.5 7.5 0 1 0 6.3 7.4V9a10 10 0 0 0 5.8 1.8V6.7c-.8 0-1.6-.2-2.3-.5Z"/>
      </svg>
    </a>

    <!-- TWITTER CLÁSICO -->
    <a class="social-link x"
       href="https://x.com/fonsichu_"
       target="_blank" rel="noopener noreferrer"
       aria-label="Twitter" title="Twitter">
      <svg viewBox="0 0 24 24">
        <path d="M23.95 4.57a10 10 0 0 1-2.83.78 4.94 4.94 0 0 0 2.16-2.72 9.9 9.9 0 0 1-3.13 1.2 4.92 4.92 0 0 0-8.39 4.49A13.98 13.98 0 0 1 1.64 3.16a4.93 4.93 0 0 0 1.52 6.58 4.9 4.9 0 0 1-2.23-.62v.06a4.93 4.93 0 0 0 3.95 4.83 4.9 4.9 0 0 1-2.22.08 4.94 4.94 0 0 0 4.6 3.42A9.9 9.9 0 0 1 0 19.54a13.94 13.94 0 0 0 7.55 2.21c9.05 0 14-7.5 14-14v-.64a10 10 0 0 0 2.46-2.54Z"/>
      </svg>
    </a>

  </nav>
</footer>

<script>
const videoArea = document.getElementById("videoArea");
const fullscreenIcon = document.getElementById("fullscreenIcon");

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await videoArea.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("Error al activar pantalla completa:", error);
  }
}

document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    fullscreenIcon.innerHTML = `
      <path d="M8 3v5H3"/>
      <path d="M16 3v5h5"/>
      <path d="M3 16h5v5"/>
      <path d="M21 16h-5v5"/>
    `;
  } else {
    fullscreenIcon.innerHTML = `
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
    `;
  }
});
</script>

</body>
</html>
