
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fonsichu Multichat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FONSI<span>CHU</span></h1>
    <span class="live">● EN DIRECTO</span>
  </header>

  <main>
    <section class="stream">
      <iframe
        src="https://player.kick.com/fonsichu"
        title="Directo de Fonsichu"
        allowfullscreen>
      </iframe>
    </section>

    <section class="chat">
      <div class="chat-title">
        <h2>CHAT UNIFICADO</h2>
        <span>TWITCH + KICK</span>
      </div>

      <div class="filters">
        <button data-filter="all" class="active">Todos</button>
        <button data-filter="twitch">Twitch</button>
        <button data-filter="kick">Kick</button>
      </div>

      <div id="messages">
        <p class="system">Conectando con los chats...</p>
      </div>

      <form id="chatForm">
        <select id="platform">
          <option value="twitch">Enviar a Twitch</option>
          <option value="kick">Enviar a Kick</option>
        </select>

        <input
          id="messageInput"
          maxlength="500"
          placeholder="Inicia sesión para escribir..."
          disabled>

        <button id="sendButton" disabled>Enviar</button>
      </form>

      <p id="status">Conectando...</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
