
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonsichu</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  background: #000;
}

.video-area {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-area iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.fullscreen-button {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 5;
  width: 42px;
  height: 42px;
  border: 1px solid #ffffff30;
  border-radius: 10px;
  background: #171717dd;
  color: white;
  font-size: 21px;
  cursor: pointer;
  opacity: .75;
  transition: .2s;
}

.fullscreen-button:hover {
  opacity: 1;
  background: #292929;
}

.chat {
  min-width: 0;
  min-height: 0;
  background: #0e0e10;
  border-left: 1px solid #252525;
}

.chat iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.video-area:fullscreen {
  width: 100%;
  height: 100%;
  background: #000;
}

.video-area:fullscreen iframe {
  width: 100%;
  height: 100%;
}

@media (max-width: 700px) {
  html, body {
    overflow: auto;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  .video-area {
    width: 100%;
    aspect-ratio: 16 / 9;
    flex: none;
  }

  .chat {
    flex: 1;
    border-left: 0;
    border-top: 1px solid #252525;
  }
}
</style>
</head>

<body>

<div class="container">

  <section class="video-area" id="videoArea">

    <iframe
      id="kickPlayer"
      src="https://player.kick.com/fonsichu"
      title="Fonsichu en Kick"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>

    <button
      class="fullscreen-button"
      onclick="toggleFullscreen()"
      title="Pantalla completa">
      ⛶
    </button>

  </section>

  <section class="chat">
    <iframe
      src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io&darkpopout"
      title="Chat de Fonsichu">
    </iframe>
  </section>

</div>

<script>
async function toggleFullscreen() {
  const player = document.getElementById("videoArea");

  try {
    if (!document.fullscreenElement) {
      await player.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error("No se pudo activar pantalla completa:", error);
  }
}
</script>

</body>
</html>
