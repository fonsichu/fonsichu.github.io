<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fonsichu · En directo</title>

  <style>
    :root {
      --fondo: #0e0e10;
      --barra: #18181b;
      --borde: #2f2f35;
      --texto: #efeff1;
      --morado: #9147ff;
      --verde-kick: #53fc18;
      --ancho-chat: 340px;
      --alto-barra: 56px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    /* ESTRUCTURA PRINCIPAL */
    .pagina {
      display: grid;
      grid-template-columns: 1fr var(--ancho-chat);
      grid-template-rows: 1fr var(--alto-barra);

      grid-template-areas:
        "video chat"
        "barra barra";

      height: 100vh;
      height: 100dvh;
    }

    /* STREAM DE KICK */
    .video {
      grid-area: video;
      background: #000;
      min-width: 0;
      min-height: 0;
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* CHAT DE TWITCH */
    .chat {
      grid-area: chat;
      background: var(--barra);
      border-left: 1px solid var(--borde);
      min-height: 0;
    }

    .chat iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* BARRA INFERIOR */
    .barra {
      grid-area: barra;
      background: var(--barra);
      border-top: 1px solid var(--borde);

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 16px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .canal {
      font-weight: bold;
      margin-right: auto;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .directo {
      background: #e91916;
      color: white;

      font-size: 12px;
      font-weight: bold;

      padding: 4px 7px;
      border-radius: 4px;
    }

    .nombre {
      color: var(--verde-kick);
      font-weight: bold;
    }

    .boton {
      color: var(--texto);
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;

      padding: 8px 12px;
      border-radius: 6px;

      background: #2f2f35;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .boton:hover {
      filter: brightness(1.3);
    }

    .boton.sub {
      background: var(--morado);
    }

    /* VERSIÓN MÓVIL */
    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .pagina {
        grid-template-columns: 1fr;
        grid-template-rows: auto 600px var(--alto-barra);

        grid-template-areas:
          "video"
          "chat"
          "barra";
      }

      .video {
        aspect-ratio: 16 / 9;
      }

      .chat {
        border-left: 0;
        border-top: 1px solid var(--borde);
      }

      .canal {
        display: none;
      }
    }

  </style>
</head>

<body>

  <div class="pagina">

    <!-- STREAM DE KICK -->
    <div class="video">
      <iframe
        src="https://player.kick.com/fonsichu?autoplay=true"
        allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture"
        title="Directo de Fonsichu en Kick">
      </iframe>
    </div>


    <!-- CHAT DE TWITCH -->
    <div class="chat">
      <iframe
        src="https://www.twitch.tv/embed/fonsichu/chat?parent=fonsichu.github.io&darkpopout"
        title="Chat de Twitch de Fonsichu">
      </iframe>
    </div>


    <!-- BARRA INFERIOR -->
    <nav class="barra">

      <div class="canal">
        <span class="directo">EN DIRECTO</span>
        <span class="nombre">FONSICHU</span>
      </div>

      <a
        class="boton sub"
        href="https://www.twitch.tv/subs/fonsichu"
        target="_blank"
        rel="noopener">
        Suscríbete
      </a>

      <a
        class="boton"
        href="https://kick.com/fonsichu"
        target="_blank"
        rel="noopener">
        Kick
      </a>

      <a
        class="boton"
        href="https://www.twitch.tv/fonsichu"
        target="_blank"
        rel="noopener">
        Twitch
      </a>

    </nav>

  </div>

</body>
</html>
